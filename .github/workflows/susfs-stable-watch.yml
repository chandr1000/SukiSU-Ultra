# Plan §9.2 (Phase 5B) — daily sha watch of the susfs4ksu STABLE branch pinned in
# docs/sync/SUSFS_VERSION (C6: stable-only; -dev twins are excluded from tracking).
# On movement it opens ONE deduped issue "SUSFS stable branch updated → run Phase 3".
# The manifest is updated by humans in Phase 3 (§7.5) — never by this bot.
# NOTE: schedules only run from the default branch — keep this file on main.
name: susfs-stable-watch

on:
  schedule:
    - cron: "0 4 * * *"        # daily 04:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned sha with susfs4ksu tip
        id: watch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const manifest = fs.readFileSync('docs/sync/SUSFS_VERSION', 'utf8');
            const branch = (manifest.match(/^branch:\s*(\S+)/m) || [])[1];
            const pinned = (manifest.match(/^commit:\s*(\S+)/m) || [])[1];
            if (!branch || !pinned) {
              core.setFailed('docs/sync/SUSFS_VERSION missing/unparseable — plan §4.5');
              return;
            }
            const out = cp.execSync(
              `git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/${branch}`,
              { encoding: 'utf8' });
            const tip = (out.trim().split('\t')[0]) || 'missing';
            core.setOutput('branch', branch);
            core.setOutput('pinned', pinned);
            core.setOutput('tip', tip);
            core.setOutput('moved', tip !== 'missing' && tip !== pinned ? 'yes' : 'no');

      - name: Open Phase 3 issue on movement
        if: steps.watch.outputs.moved == 'yes' || steps.watch.outputs.tip == 'missing'
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ steps.watch.outputs.branch }}
          PINNED: ${{ steps.watch.outputs.pinned }}
          TIP: ${{ steps.watch.outputs.tip }}
        with:
          script: |
            const { BRANCH, PINNED, TIP } = process.env;
            const missing = TIP === 'missing';
            const title = missing
              ? `SUSFS stable branch missing: ${BRANCH} → check susfs4ksu (Phase 3)`
              : 'SUSFS stable branch updated → run Phase 3';
            // dedupe: one open alert at a time (R5 alert fatigue)
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "SUSFS stable branch"`;
            const existing = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            if (existing.data.total_count > 0) { core.info('open alert already exists — skipping'); return; }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: 'Plan §7 (Phase 3) integration due.\n\n' +
                `- Branch: \`${BRANCH}\`\n` +
                `- Pinned sha (docs/sync/SUSFS_VERSION): \`${PINNED}\`\n` +
                `- Current tip: \`${TIP}\`\n\n` +
                (missing
                  ? 'The tracked branch vanished upstream — verify the §7.2 mapping table before acting.'
                  : 'Run Phase 3 (§7.1–§7.5): integrate on an integrate/susfs-* branch, re-pin the manifest (§7.5), then close this issue.') +
                '\n\nC6 policy: stable-only. Do NOT pull `-dev` fixes into this lane.'
            });
